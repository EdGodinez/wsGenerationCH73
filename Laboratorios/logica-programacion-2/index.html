
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">
        <h1>Conversor de temperaturas</h1>
        <p>Convierte grados Celsius a Kelvin y Fahrenheit.</p>

        <form id="formTemperatura">
            <label for="gradosCelsius">
                Temperatura en Celsius (°C)
            </label>

            <input
                type="number"
                id="gradosCelsius"
                name="gradosCelsius"
                placeholder="60°"
                step="any"
                required
            >

            <button type="submit">Calcular temperatura</button>
        </form>

        <section class="resultados">
            <h2>Resultados</h2>

            <p id="resultadoKelvin"></p>
            <p id="resultadoFahrenheit"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
