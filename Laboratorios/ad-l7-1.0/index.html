  <h1 class="text-center text-primary mt-5">
    Mi laboratorio con Bootstrap
  </h1>


  <div class="container mt-4">

    <!-- Contenedor para la alerta -->
    <div id="alertContainer"></div>

    <!-- Botón para mostrar la alerta -->
    <button type="button" class="btn btn-primary" id="theButton">
      The Button
    </button>

  </div>



  <div class="container mt-5 d-flex flex-column">

    <div class="row text-center">

      <div class="col-2 bg-light text-dark p-3">
        the left side
      </div>

      <div class="col-8 bg-primary text-white p-3">
        the centre side
      </div>

      <div class="col-2 bg-light text-dark p-3">
        the right side
      </div>

    </div>

    <div class="row">
      <div class="col-12 bg-dark text-white text-center p-3">
        Footer
      </div>
    </div>

  </div>


  <!-- Bootstrap Form -->
  <div class="container mt-5 mb-5">

    <h2 class="mb-4">Contact Form</h2>

    <form id="contactForm">

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">
          Email address
        </label>

        <input type="email" class="form-control" id="email" placeholder="eduardo@godinez.com" required>
      </div>

      <!-- Textarea -->
      <div class="mb-3">
        <label for="message" class="form-label">
          Message
        </label>

        <textarea class="form-control" id="message" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">
        Submit
      </button>

    </form>

  </div>
