<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD-L6-1.0 | Bootstrap</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- CSS personalizado -->
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <div class="container-fluid">

    <h1>Mi laboratorio de Bootstrap</h1>

    <h2>Task 3: Buttons and Colours</h2>

    <button type="button" class="btn btn-primary">
      Primary
    </button>

    <button type="button" class="btn btn-success">
      Success
    </button>

    <button type="button" class="btn btn-danger">
      Danger
    </button>


    <h2>Task 4: Text Alignment</h2>

    <p class="text-start">Left</p>

    <p class="text-center text-danger">Center</p>

    <p class="text-end">Right</p>


    <h2>Task 5: Card and List Group</h2>

    <div class="card" style="width: 18rem;">

      <div class="card-header">
        Task card.
      </div>

      <img src="img/fruta.png" class="card-img-top" alt="Basket of fruits">

      <ul class="list-group list-group-flush">
        <li class="list-group-item">Apple</li>
        <li class="list-group-item">Orange</li>
        <li class="list-group-item">Banana</li>
      </ul>

    </div>


  </div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- JavaScript personalizado -->
  <script src="script.js"></script>

</body>

</html>
